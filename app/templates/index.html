<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HF-04.5 Music Annotation</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>HF-04.5 Music Annotation</h1><p id="status">Upload an annotated page.</p><section id="upload"><input id="file" type="file" accept="image/*"><button id="generate">Generate YOLO draft</button></section><section id="review" hidden><h2>1. Review annotation mask</h2><div class="toolbar"><button data-mode="pan" class="active">PAN</button><button data-mode="add">ADD</button><button data-mode="erase">ERASE</button><button id="undo">UNDO</button><label>Brush <input id="brush" type="range" min="3" max="60" value="14"></label><button id="fit">FIT</button><button id="zin">+</button><button id="zout">−</button></div><div id="viewport"><div id="stage"><img id="page"><img id="mask"><canvas id="draw"></canvas></div></div><button id="authorise">AUTHORISE MASK + RUN FROZEN V8.9</button></section><section id="whole" hidden><h2>2. Whole-page result</h2><div class="pair"><div><h3>ORIGINAL ANNOTATED</h3><img id="original"></div><div><h3>V8.9 CORRECTED</h3><img id="corrected"></div></div><details><summary>Diagnostics</summary><div id="diaglinks"></div></details><textarea id="note" placeholder="Optional page-level review note"></textarea><div class="actions"><button data-decision="approved">APPROVE CORRECTED PAGE</button><button data-decision="return_to_mask">RETURN TO MASK REVIEW</button><button data-decision="flag_failure">FLAG CORRECTION FAILURE</button></div><button id="package">PACKAGE EVIDENCE</button><a id="download" hidden>DOWNLOAD ZIP</a></section></main><script src="/static/app.js"></script></body></html>
