name: Sync to Hugging Face alpha

on:
  push:
    branches:
      - main


jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: debolton/MusicAnnotationProject-alpha
          hf_token: ${{ secrets.HF_TOKEN }}
          github_branch: main
